version: '3.8'

services:
  proxy:
    image: nginx:alpine
    container_name: sikadir_proxy
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - supabase_network_Frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sikadir_frontend
    # Exposing ports is not needed since Nginx proxy handles it
    networks:
      - supabase_network_Frontend
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sikadir_backend
    environment:
      # Use the proxy domain as base URL
      - IN_DOCKER=true
    networks:
      - supabase_network_Frontend
    restart: unless-stopped

networks:
  # This network is created by Supabase CLI (npx supabase start)
  supabase_network_Frontend:
    external: true
