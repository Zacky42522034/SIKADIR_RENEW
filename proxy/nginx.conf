# Rate Limiting Zones
# - limit_req: Max 10 requests per second per IP
# - limit_conn: Max 20 concurrent connections per IP
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name localhost;

    # Use Docker's built-in DNS resolver so container IPs are re-resolved dynamically
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Apply max concurrent connections limit
    limit_conn addr 20;

    # Increase client body size for face image uploads (base64 images can be large)
    client_max_body_size 10M;

    # Backend API Routing (FastAPI)
    location /api/ {
        # Limit requests to API with a burst of 20
        limit_req zone=mylimit burst=20 nodelay;
        
        # Strip the /api prefix before passing to backend
        rewrite ^/api/(.*) /$1 break;
        
        # Use variable to force DNS re-resolution on every request
        set $backend_upstream http://sikadir_backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Increase timeouts for AI face detection (can be slow on first load)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Supabase Routing (Kong Gateway)
    location /supabase/ {
        # Limit requests to DB/Auth API
        limit_req zone=mylimit burst=50 nodelay;
        
        # Strip the /supabase prefix before passing to Supabase Kong
        rewrite ^/supabase/(.*) /$1 break;
        
        # Kong runs on port 8000 inside the Supabase network
        set $kong_upstream http://supabase_kong_Frontend:8000;
        proxy_pass $kong_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Support for WebSockets (Supabase Realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend Routing
    location / {
        limit_req zone=mylimit burst=50 nodelay;
        
        set $frontend_upstream http://sikadir_frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
